name = "Jerry"
grammar = "jerry"
path_suffixes = ["jer"]
language_servers = ["jerry-lsp"]
line_comment = "//"
block_comment = ["/*", "*/"]

# Characters that auto-close the currently open bracket/quote.
autoclose_before = ";:.,=}])"

[[brackets]]
start = "{"
end = "}"
close = true
newline = true

[[brackets]]
start = "["
end = "]"
close = true
newline = false

[[brackets]]
start = "("
end = ")"
close = true
newline = false

[[brackets]]
start = "\""
end = "\""
close = true
newline = false
